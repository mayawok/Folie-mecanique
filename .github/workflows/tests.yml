# Tests sans écran du prototype (Godot 4.3, mode headless). Se lance sur les branches de travail et à la main.
# Un test échoue si sa sortie contient « ÉCHEC » ou si Godot signale une erreur de script.
name: Tests
on:
  push:
    branches: ["grille-v2", "grille-v2-suite", "grille-v2-dessin", "grille-v2-ecran", "grille-v2-camp"]
    paths: ["game/**", ".github/workflows/tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v5
      - name: Importer le projet (enregistre les class_name)
        run: godot --headless --path game --import || true
      - name: Lancer les tests
        run: |
          fin=0
          for t in test_base_vehicule test_libre test_voiture test_assemblage test_ouverture test_grange test_camp test_combat; do
            echo "=== $t ==="
            godot --headless --path game -s res://tests/$t.gd > /tmp/$t.log 2>&1 || true
            tail -n 60 /tmp/$t.log
            if grep -q "ÉCHEC\|SCRIPT ERROR\|Parse Error" /tmp/$t.log; then echo ">>> $t : ÉCHEC"; fin=1; fi
          done
          exit $fin
  captures:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v5
      - name: Écran virtuel et rendu logiciel
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 > /dev/null
      - name: Importer le projet
        run: godot --headless --path game --import || true
      - name: Captures d'écran
        run: |
          mkdir -p /tmp/captures
          xvfb-run -a -s "-screen 0 1280x720x24" godot --path game --rendering-driver opengl3 --resolution 1280x720 -s res://tests/capture_base.gd -- /tmp/captures 2>&1 | grep -v ALSA | tail -20
          ls -la /tmp/captures
          test -f /tmp/captures/base_t23.png
          xvfb-run -a -s "-screen 0 1280x720x24" godot --path game --rendering-driver opengl3 --resolution 1280x720 -s res://tests/capture_ecran.gd -- /tmp/captures 2>&1 | grep -v ALSA | tail -20
          test -f /tmp/captures/ecran.jpg
          echo "B64DEBUT"; base64 -w0 /tmp/captures/ecran.jpg | fold -w 3000; echo; echo "B64FIN"
      - uses: actions/upload-artifact@v4
        with:
          name: captures
          path: /tmp/captures
