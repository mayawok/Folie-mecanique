# Construit le prototype Godot pour le navigateur et le publie sur GitHub Pages.
# Se lance à chaque envoi qui modifie game/ (ou à la main : onglet Actions).
name: Prototype web
on:
  push:
    branches: [main]
    paths: ["game/**", ".github/workflows/web.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v5
      - name: Modèles d'export
        run: |
          V=${GODOT_VERSION:-4.3}
          T=$HOME/.local/share/godot/export_templates/$V.stable
          mkdir -p "$T"
          cp -r /root/.local/share/godot/export_templates/$V.stable/. "$T"/ 2>/dev/null || true
          if [ ! -f "$T/web_nothreads_release.zip" ]; then
            wget -q https://github.com/godotengine/godot/releases/download/$V-stable/Godot_v$V-stable_export_templates.tpz -O /tmp/t.tpz
            unzip -q -o /tmp/t.tpz -d /tmp/t
            cp /tmp/t/templates/* "$T"/
          fi
          ls "$T"
      - name: Export web
        run: |
          mkdir -p build/web
          cd game
          # Version affichée dans le menu principal (heure de Paris)
          echo "{\"version\": \"$(TZ=Europe/Paris date +'%d/%m %Hh%M') · ${GITHUB_SHA::7}\"}" > data/version.json
          godot --headless --import || true
          godot --headless --export-release "Web" ../build/web/index.html
          # Nom unique pour le paquet du jeu : un navigateur ne peut pas garder l'ancien en cache
          cd ../build/web
          P="index-${GITHUB_SHA::8}.pck"
          if grep -q '"executable":"index"' index.html; then
            cp index.pck "$P"
            sed -i "s/\"executable\":\"index\"/\"executable\":\"index\",\"mainPack\":\"$P\"/; s/\"index.pck\":/\"$P\":/" index.html
          fi
          # La page elle-même n'est jamais gardée en cache
          sed -i 's|<head>|<head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache">|' index.html
          grep -o '"mainPack":"[^"]*"' index.html || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
