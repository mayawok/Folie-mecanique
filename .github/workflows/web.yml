# Construit le prototype Godot pour le navigateur et le publie sur GitHub Pages.
# Se lance à chaque envoi qui modifie game/ (ou à la main : onglet Actions).
name: Prototype web
on:
  push:
    branches: [main]
    paths: ["game/**", ".github/workflows/web.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Modèles d'export
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Export web
        run: |
          mkdir -p build/web
          cd game
          godot --headless --import || true
          godot --headless --export-release "Web" ../build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
