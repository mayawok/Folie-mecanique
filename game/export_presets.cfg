[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*"
export_path="../build/web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/head_include="<meta name='apple-mobile-web-app-capable' content='yes'><meta name='mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'><style>html,body{height:100%;background:#000}</style><script>(function(){try{if(navigator.audioSession){navigator.audioSession.type='playback';}}catch(e){}var m=document.querySelector('meta[name=viewport]');if(m){m.setAttribute('content','width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover');}window.fmZonesSures=function(){var d=document.createElement('div');d.style.cssText='position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';document.body.appendChild(d);var c=getComputedStyle(d);var r=[c.paddingLeft,c.paddingTop,c.paddingRight,c.paddingBottom].map(parseFloat).join(',')+','+window.innerWidth;d.remove();return r;};})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
