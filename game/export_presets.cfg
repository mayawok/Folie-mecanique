t-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';document.body.appendChild(d);var c=getComputedStyle(d);var r=[c.paddingLeft,c.paddingTop,c.paddingRight,c.paddingBottom].map(parseFloat).join(',')+','+window.innerWidth;d.remove();return r;};})();</script>"
